<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Kontraktor</title>
<meta name="description" content="Denah, daftar pintu & jendela, dan catatan teknis rumah Japandi tropis, dibuat otomatis dari data model 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Shippori+Mincho:wght@600&display=swap">
<style>
/* A4 pages on paper, a readable column on screen. Plans print at 1:100. */
:root { --ink: #232220; --muted: #6A665F; --line: #DEDAD2; --paper: #FBFAF7; --accent: #2F5D4A; --chip: #EEEBE5;
  --display: "Shippori Mincho", Georgia, serif; --ui: "Albert Sans", system-ui, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #FBFAF7; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9E6DF; color: var(--ink); font-family: var(--ui); font-size: 13px; line-height: 1.45; }
.toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; justify-content: center; padding: 10px 16px; background: rgba(233, 230, 223, 0.92); }
.toolbar a, .toolbar button { font: 600 13px var(--ui); border-radius: 8px; padding: 9px 14px; border: 1px solid var(--accent); text-decoration: none; cursor: pointer; }
.toolbar button { background: var(--accent); color: #fff; }
.toolbar a { color: var(--accent); background: transparent; }
.page { width: 210mm; min-height: 297mm; margin: 12px auto; padding: 14mm 14mm 12mm; background: var(--paper); box-shadow: 0 1px 6px rgba(0,0,0,0.12);
  display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 820px) { .page { width: auto; min-height: 0; margin: 12px 16px; padding: 18px 16px; } .plan { width: 100% !important; height: auto !important; } }
header.ph { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
header.ph h2 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
header.ph span { color: var(--muted); font-size: 11px; }
footer.pf { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10.5px; display: flex; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.15; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.hero { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; background: var(--chip); margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.stats div { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.code { font-weight: 600; color: var(--accent); white-space: nowrap; }
.sched td, .sched th { font-size: 11px; padding: 3px 5px; }
.sched td:not(:last-child) { white-space: nowrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.plan-wrap { display: flex; justify-content: center; }
.plan .halo { paint-order: stroke; stroke: #FBFAF7; stroke-width: 0.05; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 11px; margin-top: 6px; justify-content: center; }
.legend i { display: inline-block; width: 14px; height: 8px; margin-right: 4px; vertical-align: middle; border: 1px solid #A9A398; }
.notes h3 { font-size: 12px; margin: 10px 0 2px; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 2px 0; }
.renders { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.renders figure { margin: 0; }
.renders img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; background: var(--chip); }
.renders figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff; }
  .toolbar { display: none; }
  .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; width: 210mm; height: 297mm; }
}
</style>
</head>
<body>
<div class="toolbar"><a href="./">← Model 3D</a><button type="button" onclick="window.print()">Cetak / Simpan PDF</button></div>
<main id="doc"><p style="text-align:center;padding:40px">Memuat dokumen…</p></main>
<script type="module">
const bust = `?v=${Date.now()}`;
const { planSVG, openingSchedule } = await import(`./src/plan.js${bust}`);
const data = await (await fetch('data/house.json', { cache: 'no-cache' })).json();
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const num = (v, d = 2) => v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
const norm = ([a, b, c, d]) => [Math.min(a, c), Math.min(b, d), Math.max(a, c), Math.max(b, d)];
const ver = data.meta.version;
let pageNo = 0;
const page = (title, body, sub = '') => `<section class="page"><header class="ph"><h2>${title}</h2><span>${esc(sub)}</span></header>${body}
  <footer class="pf"><span>Rumah Japandi Tropis · ${esc(ver)}</span><span>${++pageNo}</span></footer></section>`;

// rooms
const rooms = data.floors.filter((f) => f.name).map((f) => { const [x0, y0, x1, y1] = norm(f.rect); return { ...f, w: x1 - x0, h: y1 - y0 }; });
const levelName = (l) => (l === 'site' ? 'Tapak' : data.levels[l].name);
const roomRows = ['lt1', 'lt2', 'site'].map((l) => rooms.filter((r) => r.level === l).map((r) =>
  `<tr><td>${esc(r.name)}</td><td>${levelName(r.level)}</td><td class="n">${num(r.w)} × ${num(r.h)} m</td><td class="n">${num(r.w * r.h, 1)} m²</td></tr>`).join('')).join('');

const lb = data.meta.lb;
const cover = `<h1>Rumah Japandi Tropis</h1>
  <p class="lede">Dokumen kontraktor: denah, daftar pintu & jendela, dan catatan teknis. Dibuat otomatis dari data model 3D, jadi selalu sama dengan model.</p>
  <img class="hero" src="docs/img/all-corner.jpg" alt="Tampak dari tikungan jalan">
  <div class="stats"><div><b>9 × 14 m</b><span>tanah, posisi hook</span></div><div><b>±${lb.total} m²</b><span>luas bangunan</span></div>
    <div><b>±${lb.lt1} m²</b><span>lantai 1</span></div><div><b>±${lb.lt2} m²</b><span>lantai 2</span></div></div>
  <table><thead><tr><th>Ruang</th><th>Lantai</th><th class="n">Ukuran</th><th class="n">Luas</th></tr></thead><tbody>${roomRows}</tbody></table>`;

const legend = `<div class="legend"><span><i style="background:#232220"></i>dinding luar</span><span><i style="background:#4A4741"></i>dinding dalam</span>
  <span><i style="background:#8F8A80"></i>pagar/batas</span><span><i style="background:repeating-linear-gradient(90deg,#6B665E 0 3px,#fff 3px 6px)"></i>roster</span>
  <span><i style="background:#fff"></i>jendela (garis tengah)</span><span><i style="background:#2F5D4A;border-color:#2F5D4A"></i>kode pintu/jendela</span></div>`;

const sched = openingSchedule(data).map((o) => `<tr><td class="code">${o.code}</td><td>${o.kind}</td><td>${o.level.replace('Lantai ', 'Lt ')}</td>
  <td class="n">${num(o.w)}</td><td class="n">${num(o.h)}</td><td class="n">${o.sill ? num(o.sill) : '–'}</td><td>${esc(o.note)}</td></tr>`).join('');
const notes = (data.notes || []).map((n) => `<h3>${esc(n.topic)}</h3><ul>${n.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`).join('');

const renders = [['all-corner-malam', 'Tampak tikungan, malam'], ['all-living', 'Ruang keluarga, dapur, meja makan'], ['all-garden', 'Taman dan deck dari dalam'],
  ['lt1-iso', 'Potongan lantai 1'], ['lt2-iso', 'Potongan lantai 2'], ['all-corner', 'Tampak tikungan, siang']]
  .map(([f, c]) => `<figure><img src="docs/img/${f}.jpg" alt="${c}"><figcaption>${c}</figcaption></figure>`).join('');

document.getElementById('doc').innerHTML =
  page('Ringkasan', cover, 'ukuran dalam meter, as dinding') +
  page('Denah Lantai 1', `<div class="plan-wrap">${planSVG(data, 'lt1')}</div>${legend}`, 'termasuk tapak, carport, taman · 1:100 di A4') +
  page('Denah Lantai 2', `<div class="plan-wrap">${planSVG(data, 'lt2')}</div>${legend}`, '1:100 di A4') +
  page('Pintu & Jendela', `<table class="sched"><thead><tr><th>Kode</th><th>Jenis</th><th>Lantai</th><th class="n">Lebar</th><th class="n">Tinggi</th><th class="n">Ambang</th><th>Keterangan</th></tr></thead><tbody>${sched}</tbody></table>`, 'meter; tinggi = tinggi bukaan, ambang = tinggi dari lantai') +
  page('Catatan Teknis', `<div class="notes">${notes}</div>`) +
  page('Tampak 3D', `<div class="renders">${renders}</div>`, 'render dari model 3D');
document.body.dataset.ready = 'true';
</script>
</body>
</html>
